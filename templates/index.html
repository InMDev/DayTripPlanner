<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day Trip Activity Planner</title>
    <!-- Modern Font Pairing -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    
    <nav class="navbar" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <a class="title" href="#">Day Trip Activity Planner</a>
        </div>
    </nav>

    <div class="container">
        <div class="box">
            <form id="activityForm">
                <div class="field is-horizontal">
                    <label class="field-label label" for="budget">Budget ($):</label>
                    <div class="field-body">
                        <input class="input" type="number" id="budget" name="budget" required placeholder="e.g. 100">
                    </div>
                </div>
                
                <div class="field is-horizontal">
                    <label class="field-label label" for="time">Max Time (hours):</label>
                    <div class="field-body">
                        <input class="input" type="number" id="time" name="time" required placeholder="e.g. 8">
                    </div>
                </div>
                
                <h3>Activities</h3>
                <div style="overflow-x: auto;">
                    <table id="activityTable">
                        <thead>
                            <tr>
                                <th>Name of Activity</th>
                                <th>Cost</th>
                                <th>Duration (hours)</th>
                                <th>Rank (0-10)</th>
                                <th style="width: 100px;">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><input class="input" type="text" name="activityName[]" aria-label="Activity Name" placeholder="Activity Name"></td>
                                <td><input class="input" type="number" name="activityCost[]" aria-label="Activity Cost" placeholder="0"></td>
                                <td><input class="input" type="number" name="activityTime[]" aria-label="Activity Duration" placeholder="0"></td>
                                <td><input class="input" type="number" name="activityValue[]" aria-label="Activity Rank" placeholder="0"></td>
                                <td><button type="button" class="button is-danger remove-row-btn" onclick="removeRow(this)" aria-label="Remove activity">Remove</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div style="margin-top: 1.5rem; display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <button type="button" class="button is-success add-row-btn" onclick="addRow()">Add Activity</button>
                    <button type="button" class="button is-primary submit-btn" onclick="submitForm()">Optimize Plan</button>
                    <button type="button" class="button is-info generate-example-btn" onclick="generateExample()">Load Example</button>
                </div>
            </form>
        </div>

        <div id="activitiesTable"></div>
        <div id="notificationContainer"></div>
    </div>

    <footer class="footer">
        <div class="content">
            <p>
                <strong>Day Trip Activity Planner</strong> by Inzaghi Moniaga. More Detailed Explanation & Inspiration <a href="https://inzaghi.notion.site/Optimize-dating-plan-in-Vancouver-as-Integer-0-1-Programming-Problem-17e2b6100f324c9bb6b8ba8c14c2d956?pvs=4" target="_blank">here</a>.
            </p>
        </div>
    </footer>

    <script>
        function generateExample() {
            var budget = document.getElementById("budget");
            var time = document.getElementById("time");
            var activityTable = document.getElementById("activityTable").getElementsByTagName('tbody')[0];
            budget.value = 100;
            time.value = 8;
            activityTable.innerHTML = `
                <tr>
                    <td><input class="input" type="text" name="activityName[]" value="Visit Stanley Park"></td>
                    <td><input class="input" type="number" name="activityCost[]" value="0"></td>
                    <td><input class="input" type="number" name="activityTime[]" value="2"></td>
                    <td><input class="input" type="number" name="activityValue[]" value="3"></td>
                    <td><button type="button" class="button is-danger remove-row-btn" onclick="removeRow(this)">Remove</button></td>
                </tr>
                <tr>
                    <td><input class="input" type="text" name="activityName[]" value="Visit Vancouver Aquarium"></td>
                    <td><input class="input" type="number" name="activityCost[]" value="30"></td>
                    <td><input class="input" type="number" name="activityTime[]" value="3"></td>
                    <td><input class="input" type="number" name="activityValue[]" value="2"></td>
                    <td><button type="button" class="button is-danger remove-row-btn" onclick="removeRow(this)">Remove</button></td>
                </tr>
                <tr>
                    <td><input class="input" type="text" name="activityName[]" value="Visit Grouse Mountain"></td>
                    <td><input class="input" type="number" name="activityCost[]" value="50"></td>
                    <td><input class="input" type="number" name="activityTime[]" value="4"></td>
                    <td><input class="input" type="number" name="activityValue[]" value="1"></td>
                    <td><button type="button" class="button is-danger remove-row-btn" onclick="removeRow(this)">Remove</button></td>
                </tr>
            `;
            
            submitForm();
        }

        function addRow() {
            var table = document.getElementById("activityTable").getElementsByTagName('tbody')[0];
            var newRow = table.insertRow();
            newRow.innerHTML = `
                <td><input class="input" type="text" name="activityName[]" aria-label="Activity Name" placeholder="Activity Name"></td>
                <td><input class="input" type="number" name="activityCost[]" aria-label="Activity Cost" placeholder="0"></td>
                <td><input class="input" type="number" name="activityTime[]" aria-label="Activity Duration" placeholder="0"></td>
                <td><input class="input" type="number" name="activityValue[]" aria-label="Activity Rank" placeholder="0"></td>
                <td><button type="button" class="button is-danger remove-row-btn" onclick="removeRow(this)" aria-label="Remove activity">Remove</button></td>
            `;
        }

        function removeRow(btn) {
            var row = btn.closest('tr');
            if (document.getElementById("activityTable").getElementsByTagName('tbody')[0].rows.length > 1) {
                row.parentNode.removeChild(row);
            } else {
                // Ideally clear input instead of removing the last row, or allow removing all but logic usually needs at least one.
                // For now, let's just clear inputs if it's the last row
                var inputs = row.querySelectorAll('input');
                inputs.forEach(input => input.value = '');
            }
        }

        var popupShown = false;

        function submitForm() {
            console.log("Submitting form...");
            var submitBtn = document.querySelector('.submit-btn');
            submitBtn.classList.add('is-loading');
            submitBtn.setAttribute('disabled', 'true');

            var stringBuilder = "";
            var table = document.getElementById("activityTable");
            // Skipping header row 0
            for (var i = 1, row; row = table.rows[i]; i++) {
                // Simple validation to ensure we don't send empty rows
                var inputs = row.getElementsByTagName("input");
                var hasValue = false;
                for(var k=0; k<inputs.length; k++) {
                    if(inputs[k].value.trim() !== "") hasValue = true;
                }

                if(!hasValue) continue;

                for (var j = 0, col; col = row.cells[j]; j++) {
                    // We only want the first 4 columns (Name, Cost, Time, Value)
                    if (j < 4) {
                        var val = col.querySelector('input').value;
                        if(val === "") val = "0"; // Default to 0/empty if blank to avoid errors
                        if(j === 0 && val === "0") val = "Unnamed Activity";

                        stringBuilder += val;
                        if (j < 3) {
                            stringBuilder += ",";
                        }
                    }
                }
                stringBuilder += ";";
            }

            var form = document.getElementById("activityForm");
            var formData = new FormData(form);
            var xhr = new XMLHttpRequest();
            // Encode the string to handle special characters properly
            xhr.open("POST", "/submit/" + encodeURIComponent(stringBuilder), true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === XMLHttpRequest.DONE) {
                    submitBtn.classList.remove('is-loading');
                    submitBtn.removeAttribute('disabled');
                    if (xhr.status === 200) {
                        console.log("Form submission successful.");
                        var response = xhr.responseText;
                        var activitiesTableDiv = document.getElementById("activitiesTable");
                        activitiesTableDiv.innerHTML = response;

                        if (!popupShown) {
                            showPopup();
                            popupShown = true;
                        }
                    } else {
                        console.error("Form submission failed with status code: " + xhr.status);
                        // Show error
                        alert("An error occurred. Please check your inputs.");
                    }
                }
            };
            xhr.send(formData);
        }

        function showPopup() {
            var popup = document.createElement('div');
            popup.className = 'popup';
            popup.innerHTML = `
                <article class="message">
                    <div class="message-header">
                        <p>Success</p>
                        <button class="delete" aria-label="delete" onclick="closePopup()"></button>
                    </div>
                    <div class="message-body">
                        Plan optimized! Scroll down to see the results.
                    </div>
                </article>
            `;
            document.body.appendChild(popup);

            // Positioning is now handled by CSS class if possible, or inline here
            popup.style.position = 'fixed';
            popup.style.top = '20px';
            popup.style.right = '20px'; // Move to top right for less intrusion
            popup.style.minWidth = '300px';
            // Animation
            popup.style.opacity = '0';
            popup.style.transition = 'opacity 0.3s';
            setTimeout(() => popup.style.opacity = '1', 10);

            // Auto hide
            setTimeout(closePopup, 5000);
        }

        function closePopup() {
            var popup = document.querySelector('.popup');
            if (popup) {
                popup.style.opacity = '0';
                setTimeout(() => {
                    if(popup.parentNode) popup.parentNode.removeChild(popup);
                }, 300);
            }
        }
    </script>
</body>
</html>
